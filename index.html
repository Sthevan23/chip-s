<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chip's — Você não está preparado para essa crocância</title>
  <meta name="description" content="Batata chips gourmet em vários sabores. Você não está preparado para essa crocância.">
  <meta name="theme-color" content="#0b0704">
  <meta property="og:title" content="Chip's — Você não está preparado para essa crocância">
  <meta property="og:image" content="assets/img/macro.webp">
  <script>document.documentElement.classList.add('js');setTimeout(function(){document.documentElement.classList.add('ready')},6000);</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>

<div class="progress" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="shake-layer" id="flash" aria-hidden="true"></div>

<a class="skip" href="#sabores">Ir para os sabores</a>

<header class="header" id="header">
  <div class="wrap header__in">
    <a class="logo" href="#crocancia" aria-label="Início"><span data-brand>Chip's</span><i></i></a>
    <nav class="nav" id="nav" aria-label="Principal">
      <a href="#crocancia">Crocância</a>
      <a href="#sabores">Sabores</a>
      <a href="#mockups">Online</a>
    </nav>
    <button class="burger" id="burger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
  </div>
</header>

<main id="topo">

  <!-- 1. CROCÂNCIA -->
  <section class="crunch" id="crocancia">
    <div class="crunch__pin" id="crunch-pin">
      <div class="crunch__photo" id="crunch-photo"><img src="assets/img/macro.webp" alt="" width="1800" height="1200"></div>
      <div class="crunch__vig"></div>
      <div class="crunch__anchor" id="crunch-anchor"></div>
      <h1 class="crunch__title" id="crunch-title" aria-label="Você não está preparado para essa crocância."></h1>
      <div class="scroll-hint" id="scroll-hint" aria-hidden="true"><span>Role</span><i></i></div>
      <div class="veil" id="veil1" aria-hidden="true"></div>
    </div>
  </section>


  <!-- 2. SABORES (um por vez, na rolagem) -->
  <section class="flv" id="sabores">
    <div class="flv__pin" id="flv-pin">
      <div class="flv__bgtext" id="flv-bgtext" aria-hidden="true"></div>
      <div class="flv__photo" aria-hidden="true"><img id="flv-img-a" alt="" width="600" height="600"><img id="flv-img-b" alt="" width="600" height="600"></div>
      <div class="flv__anchor" id="flv-anchor"></div>
      <div class="flv__panel" id="flv-panel" aria-live="polite">
        <p class="flv__kicker"><b id="flv-num">01</b> / <span id="flv-tot">06</span> <i></i> <span id="flv-tag"></span></p>
        <h2 class="flv__name" id="flv-name"></h2>
        <p class="flv__desc" id="flv-desc"></p>
        <div class="flv__price"><strong id="flv-price"></strong><small id="flv-size"></small></div>
        <nav class="flv__dots" id="flv-dots" aria-label="Escolher sabor"></nav>
      </div>
      <div class="veil" id="veil3" aria-hidden="true"></div>
      <p class="veil-text" id="veil3-text" aria-hidden="true">Impossível comer uma só.</p>
    </div>
    <div class="flv__static" id="flv-static"></div>
  </section>

  <!-- 3. ONLINE (mockups) -->
  <section class="mock" id="mockups">
    <div class="mock__pin" id="mock-pin">
      <header class="mock__head">
        <p class="kicker"><span class="dot"></span> Sempre à mão</p>
        <h2 class="sec-title gold">NO NOTEBOOK. NO CELULAR. NA SUA MÃO.</h2>
      </header>
      <div class="mock__stage" id="mock-stage">
        <div class="mock__glow" aria-hidden="true"></div>
        <div class="mock__ring" aria-hidden="true"></div>
        <img class="mock__chip mc1" data-depth="-70" src="assets/img/stack.webp" alt="" loading="lazy" width="600" height="400">
        <img class="mock__chip mc2" data-depth="90" src="assets/img/bowl.webp" alt="" loading="lazy" width="400" height="400">
        <img class="mock__chip mc3" data-depth="-110" src="assets/img/basket.webp" alt="" loading="lazy" width="600" height="400">
        <div class="laptop" id="laptop" aria-hidden="true">
          <div class="laptop__lid"><div class="laptop__screen" id="laptop-screen"></div></div>
          <div class="laptop__base"><i></i></div>
        </div>
        <div class="phone" id="phone" aria-hidden="true">
          <div class="phone__screen" id="phone-screen"></div>
          <i class="phone__notch"></i>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer__wave" aria-hidden="true"></div>
  <div class="wrap footer__grid">
    <div class="footer__brand">
      <a class="logo" href="#crocancia" aria-label="Voltar ao início"><span data-brand>Chip's</span><i></i></a>
      <p class="footer__tag gold">Você não está preparado.</p>
    </div>
    <nav class="footer__nav" aria-label="Rodapé">
      <a href="#crocancia">Crocância</a>
      <a href="#sabores">Sabores</a>
      <a href="#mockups">Online</a>
    </nav>
    <a class="footer__ig" id="insta-link" href="https://www.instagram.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg>
      <span data-handle>@chips</span>
    </a>
  </div>
  <div class="wrap footer__bar">
    <span>© <span id="year">2026</span> <span data-brand>Chip's</span></span>
    <a class="footer__top" href="#crocancia">Voltar ao topo ↑</a>
    <span>Fotos: Pexels</span>
  </div>
</footer>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/data.js?v=20"></script>
<script src="js/gl.js?v=20"></script>
<script src="js/app.js?v=20"></script>
</body>
</html>
